<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Warehouse Receiving</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
    onerror="libraryFailed()">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      text-align: center;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px;
      font-size: 26px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      min-height: 100px;
    }

    #status {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      background: white;
    }

    .success {
      background: #d8f5dc !important;
    }

    .error {
      background: #ffd9d9 !important;
    }

    .searching {
      background: #fff3cd !important;
    }

    .tracking {
      font-size: 18px;
      margin-top: 8px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="header">
  📦 Warehouse Receiving
</div>

<div class="container">

  <div id="reader"></div>

  <div id="status">
    Loading scanner...
  </div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzyI_dpKHI22joqGcDdf6TfBxwOU7Y1uyurlNw5WzZ8So054baA67JXDTk1una-TqFI0Q/exec";

let lastScan = "";
let lastScanTime = 0;


function libraryFailed() {
  document.getElementById("status").className = "error";
  document.getElementById("status").innerHTML =
    "❌ Barcode scanner library failed to load.";
}


function cleanTracking(value) {

  let tracking = String(value || "")
    .trim()
    .replace(/\s+/g, "")
    .toUpperCase();


  // USPS: 420 + destination ZIP + real tracking number
  if (/^420\d{5}\d{20,22}$/.test(tracking)) {
    tracking = tracking.substring(8);
  }


  // FedEx long barcode ending in real 12-digit tracking
  if (/^\d{30,}$/.test(tracking) && tracking.startsWith("96")) {
    tracking = tracking.slice(-12);
  }


  return tracking;
}


function getCarrier(tracking) {

  tracking = cleanTracking(tracking);


  // UPS
  if (/^1Z[A-Z0-9]{16}$/.test(tracking)) {
    return "UPS";
  }


  // USPS domestic
  if (/^(92|93|94|95|96)\d{18,20}$/.test(tracking)) {
    return "USPS";
  }


  // USPS international
  if (/^[A-Z]{2}\d{9}US$/.test(tracking)) {
    return "USPS";
  }


  // FedEx common formats
  if (
    /^\d{12}$/.test(tracking) ||
    /^\d{15}$/.test(tracking) ||
    /^\d{20}$/.test(tracking) ||
    /^\d{22}$/.test(tracking)
  ) {
    return "FedEx";
  }


  return null;
}


function barcodeScanned(decodedText) {

  const tracking = cleanTracking(decodedText);

  if (!tracking) return;

  const carrier = getCarrier(tracking);


  if (!carrier) {

    const status = document.getElementById("status");

    status.className = "searching";

    status.innerHTML =
      "Looking for tracking barcode..." +
      "<div class='tracking'>Ignored: " +
      tracking +
      "</div>";

    return;
  }


  const now = Date.now();


  if (
    tracking === lastScan &&
    now - lastScanTime < 5000
  ) {
    return;
  }


  lastScan = tracking;
  lastScanTime = now;

  submitTracking(tracking, carrier);
}


async function submitTracking(tracking, carrier) {

  const status = document.getElementById("status");

  status.className = "";

  status.innerHTML =
    "Saving..." +
    "<div class='tracking'>" +
    tracking +
    "</div>";


  const url =
    WEB_APP_URL +
    "?tracking=" +
    encodeURIComponent(tracking);


  try {

    const response = await fetch(url);

    const text = await response.text();


    if (!response.ok) {
      throw new Error(text || "Could not save package");
    }


    if (!text.toLowerCase().includes("received")) {
      throw new Error(text || "Unexpected response");
    }


    showSuccess(tracking, carrier);


  } catch (error) {

    status.className = "error";

    status.innerHTML =
      "❌ NOT SAVED" +
      "<div class='tracking'>" +
      tracking +
      "</div>" +
      "<div class='tracking'>" +
      error.message +
      "</div>";
  }
}


function showSuccess(tracking, carrier) {

  const status = document.getElementById("status");

  status.className = "success";

  status.innerHTML =
    "✅ PACKAGE RECEIVED" +
    "<div class='tracking'>" +
    carrier + " • " + tracking +
    "</div>";


  if (navigator.vibrate) {
    navigator.vibrate(150);
  }


  setTimeout(function() {

    status.className = "";

    status.innerHTML =
      "Point camera at next package tracking barcode";

  }, 2500);
}


window.addEventListener("load", function() {

  const status = document.getElementById("status");


  if (typeof Html5QrcodeScanner === "undefined") {

    status.className = "error";

    status.innerHTML =
      "❌ Scanner library did not load.";

    return;
  }


  try {

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 12,

        qrbox: {
          width: 300,
          height: 140
        },

        rememberLastUsedCamera: true
      },

      false
    );


    scanner.render(
      barcodeScanned,
      function(errorMessage) {
        // Normal while looking for barcodes
      }
    );


    status.innerHTML =
      "Point camera at package tracking barcode";


  } catch (error) {

    status.className = "error";

    status.innerHTML =
      "❌ Scanner error: " + error.message;
  }

});

</script>

</body>
</html>
