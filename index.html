<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Warehouse Receiving</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      text-align: center;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px;
      font-size: 26px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #startButton {
      font-size: 24px;
      font-weight: bold;
      padding: 18px 30px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      background: white;
    }

    .success {
      background: #d8f5dc !important;
    }

    .error {
      background: #ffd9d9 !important;
    }

    .searching {
      background: #fff3cd !important;
    }

    .tracking {
      font-size: 18px;
      margin-top: 8px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="header">
  📦 Warehouse Receiving
</div>

<div class="container">

  <button id="startButton">
    📷 START SCANNER
  </button>

  <div id="reader"></div>

  <div id="status">
    Tap START SCANNER to begin
  </div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzyI_dpKHI22joqGcDdf6TfBxwOU7Y1uyurlNw5WzZ8So054baA67JXDTk1una-TqFI0Q/exec";

let scanner = null;

let lastSavedTracking = "";
let lastSavedTime = 0;

let pendingFedExTracking = "";
let pendingFedExCount = 0;
let pendingFedExTime = 0;

let saveLock = false;


// -----------------------------
// CLEAN RAW BARCODE
// -----------------------------
function cleanTracking(value) {

  let tracking = String(value || "")
    .trim()
    .replace(/\s+/g, "")
    .toUpperCase();


  // USPS:
  // 420 + 5-digit destination ZIP + actual tracking number
  //
  // Example:
  // 420275229400109105116532400348
  // becomes:
  // 9400109105116532400348

  if (/^420\d{5}\d{20,22}$/.test(tracking)) {
    tracking = tracking.substring(8);
  }


  // FedEx long barcode:
  // long payload beginning with 96...
  // ending with the real 12-digit tracking number
  //
  // Example:
  // 9622001900000000000000873499308860
  // becomes:
  // 873499308860

  if (/^\d{30,}$/.test(tracking) && tracking.startsWith("96")) {
    tracking = tracking.slice(-12);
  }


  return tracking;
}


// -----------------------------
// IDENTIFY CARRIER
// -----------------------------
function getCarrier(tracking) {

  tracking = cleanTracking(tracking);


  // UPS
  if (/^1Z[A-Z0-9]{16}$/.test(tracking)) {
    return "UPS";
  }


  // USPS domestic
  if (/^(92|93|94|95|96)\d{18,20}$/.test(tracking)) {
    return "USPS";
  }


  // USPS international
  if (/^[A-Z]{2}\d{9}US$/.test(tracking)) {
    return "USPS";
  }


  // FedEx common lengths
  if (
    /^\d{12}$/.test(tracking) ||
    /^\d{15}$/.test(tracking) ||
    /^\d{20}$/.test(tracking) ||
    /^\d{22}$/.test(tracking)
  ) {
    return "FedEx";
  }


  return null;
}


// -----------------------------
// BARCODE DETECTED
// -----------------------------
function barcodeScanned(decodedText) {

  if (saveLock) {
    return;
  }

  const raw = String(decodedText || "")
    .trim()
    .replace(/\s+/g, "")
    .toUpperCase();

  if (!raw) return;


  const cameFromLongFedEx =
    /^\d{30,}$/.test(raw) &&
    raw.startsWith("96");


  const tracking = cleanTracking(raw);

  const carrier = getCarrier(tracking);


  if (!carrier) {

    const status = document.getElementById("status");

    status.className = "searching";

    status.innerHTML =
      "Looking for tracking barcode..." +
      "<div class='tracking'>Ignored: " +
      tracking +
      "</div>";

    return;
  }


  const now = Date.now();


  // Prevent immediate re-save of same completed package
  if (
    tracking === lastSavedTracking &&
    now - lastSavedTime < 8000
  ) {
    return;
  }


  // -----------------------------
  // FEDEX PROTECTION
  // -----------------------------

  if (carrier === "FedEx") {

    // Long FedEx barcode is trusted immediately
    // because we're extracting the final 12 digits
    if (cameFromLongFedEx) {

      pendingFedExTracking = "";
      pendingFedExCount = 0;

      submitTracking(tracking, carrier);

      return;
    }


    // Direct 12-digit FedEx read:
    // require same number twice before saving
    if (/^\d{12}$/.test(tracking)) {

      // Reset pending confirmation if too much time passed
      if (now - pendingFedExTime > 4000) {
        pendingFedExTracking = "";
        pendingFedExCount = 0;
      }


      if (tracking === pendingFedExTracking) {

        pendingFedExCount++;

      } else {

        pendingFedExTracking = tracking;
        pendingFedExCount = 1;

      }


      pendingFedExTime = now;


      const status = document.getElementById("status");


      if (pendingFedExCount < 2) {

        status.className = "searching";

        status.innerHTML =
          "Confirming FedEx tracking..." +
          "<div class='tracking'>" +
          tracking +
          "</div>";

        return;
      }


      // Confirmed twice
      pendingFedExTracking = "";
      pendingFedExCount = 0;

      submitTracking(tracking, carrier);

      return;
    }
  }


  // UPS / USPS / other accepted carrier
  submitTracking(tracking, carrier);
}


// -----------------------------
// SAVE TO GOOGLE SHEET
// -----------------------------
async function submitTracking(tracking, carrier) {

  saveLock = true;

  const status = document.getElementById("status");

  status.className = "";

  status.innerHTML =
    "Saving..." +
    "<div class='tracking'>" +
    tracking +
    "</div>";


  const url =
    WEB_APP_URL +
    "?tracking=" +
    encodeURIComponent(tracking);


  try {

    const response = await fetch(url);

    const text = await response.text();


    if (!response.ok) {
      throw new Error(text || "Could not save package");
    }


    if (!text.toLowerCase().includes("received")) {
      throw new Error(text || "Unexpected response");
    }


    lastSavedTracking = tracking;
    lastSavedTime = Date.now();

    showSuccess(tracking, carrier);


  } catch (error) {

    status.className = "error";

    status.innerHTML =
      "❌ NOT SAVED" +
      "<div class='tracking'>" +
      tracking +
      "</div>" +
      "<div class='tracking'>" +
      error.message +
      "</div>";


    // Unlock quicker after failure
    setTimeout(function() {
      saveLock = false;
    }, 1500);

  }
}


// -----------------------------
// SUCCESS
// -----------------------------
function showSuccess(tracking, carrier) {

  const status = document.getElementById("status");

  status.className = "success";

  status.innerHTML =
    "✅ PACKAGE RECEIVED" +
    "<div class='tracking'>" +
    carrier + " • " + tracking +
    "</div>";


  if (navigator.vibrate) {
    navigator.vibrate(150);
  }


  setTimeout(function() {

    status.className = "";

    status.innerHTML =
      "Ready for next package";

  }, 2000);


  // Brief lock so the same physical label
  // doesn't instantly fire another scan
  setTimeout(function() {

    saveLock = false;

  }, 3000);
}


// -----------------------------
// START CAMERA
// -----------------------------
async function startScanner() {

  const status = document.getElementById("status");
  const button = document.getElementById("startButton");


  if (typeof Html5Qrcode === "undefined") {

    status.className = "error";

    status.innerHTML =
      "❌ Barcode scanner library did not load.";

    return;
  }


  button.disabled = true;

  button.innerHTML =
    "Starting camera...";


  try {

    scanner = new Html5Qrcode("reader");


    await scanner.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      {
        fps: 15,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const width =
            Math.min(viewfinderWidth * 0.92, 550);

          const height =
            Math.min(viewfinderHeight * 0.28, 160);

          return {
            width: width,
            height: height
          };
        }
      },

      barcodeScanned,

      function(errorMessage) {
        // Normal while searching
      }

    );


    button.style.display = "none";

    status.className = "";

    status.innerHTML =
      "Point camera at package tracking barcode";


  } catch (error) {

    console.error(error);


    // iPhone fallback
    try {

      scanner = new Html5Qrcode("reader");


      await scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 15,

          qrbox: {
            width: 300,
            height: 140
          }
        },

        barcodeScanned,

        function(errorMessage) {
          // Normal while searching
        }

      );


      button.style.display = "none";

      status.className = "";

      status.innerHTML =
        "Point camera at package tracking barcode";


    } catch (fallbackError) {

      console.error(fallbackError);

      button.disabled = false;

      button.innerHTML =
        "📷 START SCANNER";

      status.className = "error";

      status.innerHTML =
        "❌ Camera could not start." +
        "<div class='tracking'>" +
        fallbackError.message +
        "</div>";
    }
  }
}


document
  .getElementById("startButton")
  .addEventListener("click", startScanner);

</script>

</body>
</html>
