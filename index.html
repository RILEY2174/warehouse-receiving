<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Warehouse Receiving</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      text-align: center;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px;
      font-size: 26px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #status {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      background: white;
    }

    .success {
      background: #d8f5dc !important;
    }

    .error {
      background: #ffd9d9 !important;
    }

    .tracking {
      font-size: 18px;
      margin-top: 8px;
      word-break: break-all;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin-top: 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="header">
  📦 Warehouse Receiving
</div>

<div class="container">

  <div id="reader"></div>

  <div id="status">
    Point camera at package barcode
  </div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzyI_dpKHI22joqGcDdf6TfBxwOU7Y1uyurlNw5WzZ8So054baA67JXDTk1una-TqFI0Q/exec";

const SCANNER_KEY = "YOUR_SCANNER_KEY";

let lastScan = "";
let lastScanTime = 0;


// Runs when a barcode is successfully read
function barcodeScanned(decodedText) {

  let tracking = String(decodedText || "")
    .trim()
    .replace(/\s+/g, "")
    .toUpperCase();

  if (!tracking) return;

  const now = Date.now();

  // Prevent repeated reads of the same barcode
  // while the camera is still pointed at it
  if (
    tracking === lastScan &&
    now - lastScanTime < 5000
  ) {
    return;
  }

  lastScan = tracking;
  lastScanTime = now;

  submitTracking(tracking);
}


// Sends tracking number to Google Apps Script
async function submitTracking(tracking) {

  const status = document.getElementById("status");

  status.className = "";
  status.innerHTML =
    "Saving..." +
    "<div class='tracking'>" +
    tracking +
    "</div>";

  const url =
    WEB_APP_URL +
    "?key=" + encodeURIComponent(SCANNER_KEY) +
    "&tracking=" + encodeURIComponent(tracking);

  try {

    const response = await fetch(url, {
      method: "GET"
    });

    const text = await response.text();

    if (!response.ok) {
      throw new Error(text || "Could not save package");
    }

    if (!text.toLowerCase().includes("received")) {
      throw new Error(text || "Unexpected response");
    }

    showSuccess(tracking);

  } catch (error) {

    console.error(error);

    status.className = "error";

    status.innerHTML =
      "❌ NOT SAVED" +
      "<div class='tracking'>" +
      tracking +
      "</div>" +
      "<div class='tracking'>" +
      error.message +
      "</div>";
  }
}


// Successful scan feedback
function showSuccess(tracking) {

  const status = document.getElementById("status");

  status.className = "success";

  status.innerHTML =
    "✅ PACKAGE RECEIVED" +
    "<div class='tracking'>" +
    tracking +
    "</div>";

  if (navigator.vibrate) {
    navigator.vibrate(150);
  }

  beep();

  setTimeout(function() {

    status.className = "";

    status.innerHTML =
      "Point camera at next package barcode";

  }, 2500);
}


// Short confirmation beep
function beep() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContextClass();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.frequency.value = 900;

    oscillator.start();

    setTimeout(function() {
      oscillator.stop();
      audioContext.close();
    }, 120);

  } catch (error) {
    console.log("Audio not available.");
  }
}


// Start barcode scanner
const scanner = new Html5QrcodeScanner(
  "reader",

  {
    fps: 10,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      const width =
        Math.min(viewfinderWidth * 0.85, 500);

      const height =
        Math.min(viewfinderHeight * 0.35, 180);

      return {
        width: width,
        height: height
      };
    },

    rememberLastUsedCamera: true,

    aspectRatio: 1.777778,

    supportedScanTypes: [
      Html5QrcodeScanType.SCAN_TYPE_CAMERA
    ]
  },

  false
);


scanner.render(
  barcodeScanned,

  function(errorMessage) {
    // Scanner generates messages continuously
    // while searching, so we intentionally ignore these.
  }
);

</script>

</body>
</html>
