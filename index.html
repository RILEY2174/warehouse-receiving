<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Warehouse Receiving</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      text-align: center;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px;
      font-size: 26px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #status {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      background: white;
    }

    .success {
      background: #d8f5dc !important;
    }

    .error {
      background: #ffd9d9 !important;
    }

    .searching {
      background: #fff3cd !important;
    }

    .tracking {
      font-size: 18px;
      margin-top: 8px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="header">
  📦 Warehouse Receiving
</div>

<div class="container">

  <div id="reader"></div>

  <div id="status">
    Point camera at package tracking barcode
  </div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzyI_dpKHI22joqGcDdf6TfBxwOU7Y1uyurlNw5WzZ8So054baA67JXDTk1una-TqFI0Q/exec";

let lastScan = "";
let lastScanTime = 0;


// Clean and normalize barcode data
function cleanTracking(value) {

  let tracking = String(value || "")
    .trim()
    .replace(/\s+/g, "")
    .toUpperCase();


  // USPS barcode:
  // 420 + destination ZIP + actual tracking number
  //
  // Example:
  // 420275229400109105116532400348
  // becomes:
  // 9400109105116532400348

  if (/^420\d{5}\d{20,22}$/.test(tracking)) {
    tracking = tracking.substring(8);
  }


  // FedEx Ground barcode:
  // long internal barcode ending with
  // the actual 12-digit tracking number

  if (/^\d{30,}$/.test(tracking) && tracking.startsWith("96")) {
    tracking = tracking.slice(-12);
  }


  return tracking;
}


// Determine carrier
function getCarrier(tracking) {

  tracking = cleanTracking(tracking);

  // UPS
  if (/^1Z[A-Z0-9]{16}$/.test(tracking)) {
    return "UPS";
  }

  // USPS domestic
  if (/^(92|93|94|95|96)\d{18,20}$/.test(tracking)) {
    return "USPS";
  }

  // USPS international
  if (/^[A-Z]{2}\d{9}US$/.test(tracking)) {
    return "USPS";
  }

  // FedEx common formats
  if (
    /^\d{12}$/.test(tracking) ||
    /^\d{15}$/.test(tracking) ||
    /^\d{20}$/.test(tracking) ||
    /^\d{22}$/.test(tracking)
  ) {
    return "FedEx";
  }

  return null;
}


// Runs whenever camera sees a barcode
function barcodeScanned(decodedText) {

  const tracking = cleanTracking(decodedText);

  if (!tracking) return;

  const carrier = getCarrier(tracking);

  if (!carrier) {

    const status = document.getElementById("status");

    status.className = "searching";

    status.innerHTML =
      "Looking for tracking barcode..." +
      "<div class='tracking'>Ignored: " +
      tracking +
      "</div>";

    return;
  }

  const now = Date.now();

  // Prevent immediate repeat reads
  if (
    tracking === lastScan &&
    now - lastScanTime < 5000
  ) {
    return;
  }

  lastScan = tracking;
  lastScanTime = now;

  submitTracking(tracking, carrier);
}


// Send tracking number to Google Sheet
async function submitTracking(tracking, carrier) {

  const status = document.getElementById("status");

  status.className = "";

  status.innerHTML =
    "Saving..." +
    "<div class='tracking'>" +
    tracking +
    "</div>";

  const url =
    WEB_APP_URL +
    "?tracking=" +
    encodeURIComponent(tracking);

  try {

    const response = await fetch(url, {
      method: "GET"
    });

    const text = await response.text();

    if (!response.ok) {
      throw new Error(text || "Could not save package");
    }

    if (!text.toLowerCase().includes("received")) {
      throw new Error(text || "Unexpected response");
    }

    showSuccess(tracking, carrier);

  } catch (error) {

    console.error(error);

    status.className = "error";

    status.innerHTML =
      "❌ NOT SAVED" +
      "<div class='tracking'>" +
      tracking +
      "</div>" +
      "<div class='tracking'>" +
      error.message +
      "</div>";
  }
}


// Success feedback
function showSuccess(tracking, carrier) {

  const status = document.getElementById("status");

  status.className = "success";

  status.innerHTML =
    "✅ PACKAGE RECEIVED" +
    "<div class='tracking'>" +
    carrier + " • " + tracking +
    "</div>";

  if (navigator.vibrate) {
    navigator.vibrate(150);
  }

  beep();

  setTimeout(function() {

    status.className = "";

    status.innerHTML =
      "Point camera at next package tracking barcode";

  }, 2500);
}


// Confirmation beep
function beep() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContextClass();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.frequency.value = 900;

    oscillator.start();

    setTimeout(function() {
      oscillator.stop();
      audioContext.close();
    }, 120);

  } catch (error) {
    console.log("Audio not available.");
  }
}


// Start scanner
const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 15,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      const width =
        Math.min(viewfinderWidth * 0.9, 550);

      const height =
        Math.min(viewfinderHeight * 0.28, 150);

      return {
        width: width,
        height: height
      };
    },

    rememberLastUsedCamera: true,

    aspectRatio: 1.777778,

    supportedScanTypes: [
      Html5QrcodeScanType.SCAN_TYPE_CAMERA
    ]
  },
  false
);


scanner.render(
  barcodeScanned,
  function(errorMessage) {
    // Ignore normal scan-search messages
  }
);

</script>

</body>
</html>
